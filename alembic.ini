# A minimal Alembic configuration for this project
[alembic]
script_location = migrations
# sqlalchemy.url intentionally omitted: ConfigParser interpolates %(...)s
# tokens against this same file, so a literal DATABASE_URL placeholder here
# crashes with InterpolationMissingOptionError before env.py ever runs.
# env.py sets sqlalchemy.url from the DATABASE_URL environment variable.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

